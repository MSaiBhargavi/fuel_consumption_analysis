
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fuel Consumption System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f6fa;
            color: #222;
        }

        nav {
            background: #17365d;
            padding: 16px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 18px;
            font-weight: bold;
        }

        main {
            max-width: 1100px;
            margin: 25px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        input, select, button {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            background: #1769aa;
            color: white;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #e5edf7;
        }

        .message {
            color: #176b37;
            font-weight: bold;
        }

        .table-wrap {
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <nav>
        <a href="/">Dashboard</a>
        <a href="/vehicles">Vehicles</a>
        <a href="/fuel-entries">Fuel Entries</a>
        <a href="/reports">Reports</a>
        <a href="/invalid-readings">Validation Report</a>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
